services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bridge_health_monitor
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate MYSQL_ROOT_PASSWORD}
    command: ["--binlog-expire-logs-seconds=259200"]
    volumes:
      - sn2h_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/features.sql:/docker-entrypoint-initdb.d/03-features.sql:ro
      - ./database/advanced.sql:/docker-entrypoint-initdb.d/04-advanced.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bridge_health_monitor
      HOST: 0.0.0.0
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      REQUIRE_SIGN_IN: "true"
      ALLOW_LEGACY_DEVICE_TOKEN: "false"
    ports: ["127.0.0.1:3100:3100"]
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  sn2h_mysql:
